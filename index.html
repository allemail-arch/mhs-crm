      const email=gv('nu_email'); if(!email.includes('@')){alert('Enter a valid email — it is the login id');return;}
      const pwd=gv('nu_pwd'); if(pwd&&pwd.length<6){alert('Password must be at least 6 characters');return;}
      const r=await api('/api/users','POST',{name,email,phone:gv('nu_phone'),role:document.getElementById('nu_role').value,team:document.getElementById('nu_team').value,department:gv('nu_dept'),manager_id:(document.getElementById('nu_mgr')||{}).value||'',password:pwd||undefined});
      if(r.error){alert(r.error);return;}
      closeModal(); state.toastMsg=name+' added — login: '+email+' / '+(pwd||'123456'); if(state.route==='users') return refresh(); return; }
    if(a==='toggleconn'){ await api('/api/connectors/'+act.dataset.ckey,'PATCH',{connected:+act.dataset.val}); state.toastMsg='Connector updated'; return refresh(); }
    if(a==='toggleauto'){ await api('/api/automation','PATCH',{key:act.dataset.akey,enabled:+act.dataset.val}); state.toastMsg='Automation updated'; return refresh(); }
    if(a==='callnow'||a==='call'){ if(!canCall()){ alert('Calling is for the sales POC. Manager and TL can see the call log in Call History and Reports.'); return; } return callFlowModal(id); }
    if(a==='editreminder'){ return editReminderModal(id); }
    if(a==='calltimer'){ if(CALL.timer) callStop(); else callStart(); return; }
    if(a==='dialnow'){ callStart(); return; }   // dialing starts the clock; the tel: link still opens
    if(a==='rempreset'){ const v=act.dataset.val; const box=document.getElementById('cl_rem'); if(!box) return;
      box.value=(v==='clear')?'':toLocalInput(presetToValue(v)); return updateRemHint(); }
    if(a==='saveremonly'){ const raw=(document.getElementById('cl_rem')||{}).value||'';
      const r=await api('/api/leads/'+id+'/reminder','POST',{next_followup_at:raw?raw.replace('T',' '):''});
      if(r.error){ alert(r.error); return; }
      closeModal(); state.toastMsg=raw?'⏰ Reminder set — '+fmtRemind(raw.replace('T',' ')):'⏰ Reminder cleared'; return refresh(); }
    if(a==='savecallflow'){
      const secs=Math.max(0,+((document.getElementById('cl_secs')||{}).value||0));
      const outcome=(document.getElementById('cl_outcome')||{}).value||'Connected';
      const status=(document.getElementById('cl_status')||{}).value||'';
      const raw=(document.getElementById('cl_rem')||{}).value||'';
      const note=gv('cl_note');
      const NEEDS=['RNR','Follow Up','Interested'];
      if(status&&NEEDS.includes(status)&&!raw){ alert('This status needs a reminder — pick when to call again.'); return; }
      const connected=/Not connected|Busy|Switched off|Wrong number/.test(outcome)?0:1;
      const body={talktime:secs,connected,outcome,notes:note};
      if(raw) body.next_followup_at=raw.replace('T',' ');
      if(status) body.status=status;
      const r=await api('/api/leads/'+id+'/call','POST',body);
      if(r.error){ alert(r.error==='reminder_required'?'Please set a reminder for this status.':r.error); return; }
      callReset(); closeModal();
      state.toastMsg='📞 Call logged'+(secs?' — '+fmtDur(secs):'')+(raw?' • reminder '+fmtRemind(raw.replace('T',' ')):'');
      return refresh(); }
    if(a==='wa'){ const l=findLeadLocal(id); const ph=String((l&&l.phone)||'').replace(/\D/g,''); if(ph){try{window.open('https://wa.me/'+ph+'?text='+encodeURIComponent('Hi '+(l?l.name.split(' ')[0]:'')),'_blank');}catch(_){}} await api('/api/leads/'+id+'/whatsapp','POST',{}); state.toastMsg='🟢 Opening WhatsApp…'; return refresh(); }
    if(a==='miss'){ const r=await api('/api/leads/'+id+'/miss','POST',{}); state.toastMsg='📵 No answer → '+(r.steps||[]).join(' + ')+'. Lead kept open.'; return refresh(); }
    if(a==='addnote'){ const v=gv('noteBox'); if(v){ await api('/api/leads/'+id+'/activity','POST',{title:'📝 Note',sub:v}); state.toastMsg='Note saved'; return refresh(); } return; }
    return;
  }
  const drill=e.target.closest('[data-drill],[data-drillowner]');
  if(drill){ const d=drill.dataset;
    /* item 3 — remember the screen this drill started from (and which report
       tab), so the leads page can offer a one-click way back to it. */
    state.drillFrom=['reports','dashboard','followups'].includes(state.route)
      ? {route:state.route, tab:state.reportTab, label:state.route==='reports'?'Reports':state.route==='followups'?'Follow-ups':'Dashboard'}
      : null;
    state.filters={q:'',status:d.fstatus||d.drillstatus||'',source:d.fsource||'',owner:d.fowner||d.drillowner||'',product:d.fproduct||'',open:d.fopen||'',overdue:d.foverdue||'',duetoday:d.fduetoday||''};
    return go('leads'); }
  const lead=e.target.closest('[data-lead]');
  if(lead && !e.target.closest('[data-action]')){ return go('lead',{id:lead.dataset.lead}); }
});

function updateSelUI(){ const n=Object.keys(selLeads).length;
  const cnt=document.getElementById('selCount'); if(cnt) cnt.textContent=n?n+' selected':'';
  const ba=document.getElementById('bulkActions'); if(ba) ba.style.display=n?'inline-flex':'none';
  document.querySelectorAll('.lead-check').forEach(c=>{ c.checked=!!selLeads[c.dataset.lead]; });
  const all=document.getElementById('selAll'); if(all){ const ids=[...new Set([...document.querySelectorAll('.lead-check')].map(c=>c.dataset.lead))]; all.checked=ids.length>0&&ids.every(id=>selLeads[id]); }
}
function updateRemHint(){ const box=document.getElementById('cl_rem'); const h=document.getElementById('cl_remhint');
  if(!box||!h) return;
  if(!box.value){ h.textContent='No reminder set.'; h.style.color=''; return; }
  const v=box.value.replace('T',' ');
  h.textContent='Reminder: '+fmtRemind(v)+' ('+untilText(v)+')';
  h.style.color=isDue(v)?'var(--red)':''; }

document.addEventListener('change',async function(e){
  const el=e.target;
  if(el.classList&&el.classList.contains('ms-box')){
    const id=el.dataset.ms, v=el.dataset.val, f=MS_FIELDS[id];
    if(f){ const cur=f.get(); f.set(el.checked?cur.concat([v]).filter((x,i,a)=>a.indexOf(x)===i):cur.filter(x=>x!==v)); }
    return render();   // the popup stays open (state.msOpen is untouched)
  }
  if(el.id==='cl_rem'){ return updateRemHint(); }
  /* Item 3 — the product picker drives the owner list */
  if(el.id==='nl_product'){ const ow=document.getElementById('nl_owner');
    if(ow) ow.innerHTML=ownerOptionsHTML(el.value,'',true); return; }
  if(el.id==='ld_product'){ const ow=document.getElementById('ld_owner');
    if(ow) ow.innerHTML=ownerOptionsHTML(el.value,(state.currentLead||{}).owner_id,false); return; }
  if(el.id==='importFile'){ return parseImportFile(el.files[0]); }
  if(el.id==='importProduct'||el.id==='importOwner'){ if(IMPORT_ROWS.length) renderImportPreview(); return; }
  if(el.id==='pageSize'){ state.leadPageSize=+el.value||25; state.leadPage=1; return render(); }
  if(el.classList&&el.classList.contains('rowown')){ const id=el.dataset.lead; const to=el.value;
    const r=await api('/api/leads/'+id,'PATCH',{owner_id:to}); if(r&&r.error){ alert(r.error); return refresh(); }
    const l=(state.leads||[]).find(x=>x.id===id); const u=state.users.find(x=>x.id===to);
    if(l){ l.owner_id=to; l.owner_name=u?u.name:l.owner_name; }              // update locally so the change is instant & visible
    state.toastMsg='✅ Reassigned to '+(u?u.name:''); return render(); }
  if(el.classList&&el.classList.contains('lead-check')){ const id=el.dataset.lead; if(el.checked) selLeads[id]=1; else delete selLeads[id]; return updateSelUI(); }
  if(el.id==='selAll'){ const ids=[...new Set([...document.querySelectorAll('.lead-check')].map(c=>c.dataset.lead))]; ids.forEach(id=>{ if(el.checked) selLeads[id]=1; else delete selLeads[id]; }); return updateSelUI(); }
  const a=el.dataset&&el.dataset.action; const id=el.dataset&&el.dataset.lead;
  if(a==='setstatus'){ const st=el.value; const l=findLeadLocal(id); const NEEDS=['RNR','Follow Up','Interested'];
    if(NEEDS.includes(st) && !(l&&l.next_followup)){ return reminderModal(id, st); }
    const r=await api('/api/leads/'+id,'PATCH',{status:st});
    if(r&&r.error==='reminder_required'){ return reminderModal(id, st); }
    state.toastMsg=(STATUS[st]?.won?'🎉 WON! Pushed to Customer CRM.':'Status updated'); return refresh(); }
  if(a==='setfollow'){ await api('/api/leads/'+id+'/reminder','POST',{next_followup_at:el.value?el.value.replace('T',' '):''});
    state.toastMsg=el.value?'⏰ Reminder set — '+fmtRemind(el.value.replace('T',' ')):'⏰ Reminder cleared'; return refresh(); }
  if(a==='setowner'){ if(!el.value) return; await api('/api/leads/'+id,'PATCH',{owner_id:el.value}); state.toastMsg='Lead reassigned'; return refresh(); }
  if(a==='setproduct'){ const r=await api('/api/leads/'+id,'PATCH',{product:el.value}); if(r&&r.error){alert(r.error);return refresh();}
    state.toastMsg='📦 Product changed to '+teamCode(el.value)+' — pick the new owner'; return refresh(); }
  /* tf_q is owned by the 'input' handler. It must NOT be handled here too:
     'change' fires on blur, blur happens *during* render(), and re-entering
     render() from there wiped the focus and moved the caret (item 4). */
  if(el.id&&el.id.startsWith('tf_')){ const k={tf_role:'role',tf_team:'team',tf_manager:'manager',tf_dept:'dept',tf_status:'status'}[el.id];
    if(k){ state.teamFilter=Object.assign({},state.teamFilter,{[k]:el.value}); return render(); } }
  if(el.classList&&el.classList.contains('closed-check')){ const id=el.dataset.lead;
    if(el.checked) state.closedSel[id]=1; else delete state.closedSel[id];
    const n=Object.keys(state.closedSel).length; const c=document.getElementById('closedSelCount');
    if(c) c.textContent=n?n+' marked':''; return; }
  if(el.id==='closedSelAll'){ const boxes=[...document.querySelectorAll('.closed-check')];
    boxes.forEach(b=>{ b.checked=el.checked; if(el.checked) state.closedSel[b.dataset.lead]=1; else delete state.closedSel[b.dataset.lead]; });
    const c=document.getElementById('closedSelCount'); const n=Object.keys(state.closedSel).length;
    if(c) c.textContent=n?n+' marked':''; return; }
  if(el.id==='fstatus'){ state.filters.status=el.value; return refresh(); }
  if(el.id==='fsource'){ state.filters.source=el.value; return refresh(); }
  if(el.id==='fowner'){ state.filters.owner=el.value; return refresh(); }
  if(el.id==='fproduct'){ state.filters.product=el.value; return refresh(); }
  if(el.id==='fdatefrom'){ state.filters.dateFrom=el.value; return refresh(); }
  if(el.id==='fdateto'){ state.filters.dateTo=el.value; return refresh(); }
});

let searchTimer=null;
let teamQTimer=null;
document.addEventListener('input',function(e){
  /* item 4 — the Team page redrew on every single letter, which rebuilt the
     input and threw the caret around. Record the text now, redraw once the
     typing pauses, and put the caret back exactly where it was. */
  if(e.target.id==='tf_q'){
    state.teamFilter=Object.assign({},state.teamFilter,{q:e.target.value});
    clearTimeout(teamQTimer); teamQTimer=setTimeout(renderKeepFocus,220); return; }
  if(e.target.id==='fq'){ state.filters.q=e.target.value; clearTimeout(searchTimer);
    searchTimer=setTimeout(async()=>{ const box=document.getElementById('fq'); const pos=box?box.selectionStart:null;
      await refresh(); const nb=document.getElementById('fq');
      if(nb){ try{ nb.focus({preventScroll:true}); }catch(_){ nb.focus(); } if(pos!=null){try{nb.setSelectionRange(pos,pos);}catch(_){}} } },250); }
});

document.addEventListener('keydown',function(e){
  if(e.key==='Enter' && (e.target.id==='globalSearch'||e.target.id==='searchBox')){ state.searchQ=e.target.value.trim(); go('search'); }
  if(e.key==='Enter' && (e.target.id==='lg_email'||e.target.id==='lg_pwd')){
    const em=gv('lg_email'); const pw=(document.getElementById('lg_pwd')||{}).value||'';
    if(em&&pw) doLogin(em,pw); }
});

/* real-time auto-refresh — keep the dashboard & follow-ups live every 15s,
   but never interrupt typing, an open modal, or bulk-selection on the leads page */
setInterval(function(){
  if(!state.user) return;
  if(document.getElementById('modalBg')) return;                 // a modal is open
  const ae=document.activeElement;
  if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return; // user is entering data
  if(!['dashboard','followups'].includes(state.route)) return;   // only auto-refresh live views
  refresh();
}, 15000);

/* boot — restores the session if there is one, else shows the login screen */
boot();
</script>
